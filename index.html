<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuisine Coach</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="side-panel" aria-label="Program settings">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">CC</div>
          <div>
            <h1>Cuisine Coach</h1>
            <p>Learn one dish a day.</p>
          </div>
        </div>

        <form class="controls" id="program-form">
          <label for="language-select">
            <span data-i18n="language">Language</span>
            <select id="language-select" aria-label="Language">
              <option value="en">English</option>
              <option value="uk">Українська</option>
            </select>
          </label>

          <label for="cuisine-select">
            <span data-i18n="cuisine">Cuisine</span>
            <select id="cuisine-select" aria-label="Cuisine"></select>
          </label>

          <label for="level-select">
            <span data-i18n="level">Level</span>
            <select id="level-select" aria-label="Level">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
            </select>
          </label>

          <label for="servings-input">
            <span data-i18n="servings">Servings</span>
            <input id="servings-input" type="number" min="1" max="6" value="1" aria-label="Servings">
          </label>

          <fieldset>
            <legend data-i18n="constraints">Constraints</legend>
            <label class="check-row">
              <input id="vegetarian-input" type="checkbox">
              <span data-i18n="vegetarian">Vegetarian</span>
            </label>
            <label class="check-row">
              <input id="no-oven-input" type="checkbox" checked>
              <span data-i18n="noOven">No oven</span>
            </label>
            <label class="check-row">
              <input id="high-protein-input" type="checkbox">
              <span data-i18n="highProtein">High protein</span>
            </label>
          </fieldset>
        </form>

        <section class="market-card" aria-label="Germany ingredient help">
          <h2 data-i18n="germanyMode">Germany Mode</h2>
          <p data-i18n="germanyModeText">Plans prefer ingredients found at Rewe, Edeka, Aldi, Lidl, Asian markets, Turkish markets, or Italian delis in Berlin.</p>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow" data-i18n="pathEyebrow">7-day cooking path</p>
            <h2 id="program-title">Italian Beginner Week</h2>
          </div>
          <div class="top-actions" role="group" aria-label="View switcher">
            <button class="tab-button active" type="button" data-view="plan" data-i18n="plan">Plan</button>
            <button class="tab-button" type="button" data-view="shopping" data-i18n="shopping">Shopping</button>
            <button class="tab-button" type="button" data-view="progress" data-i18n="progress">Progress</button>
          </div>
        </header>

        <section class="view active" id="plan-view" aria-label="Weekly plan">
          <div class="day-rail" id="day-rail"></div>
          <article class="recipe-panel" id="recipe-panel"></article>
        </section>

        <section class="view" id="shopping-view" aria-label="Shopping list">
          <div class="section-heading">
            <div>
              <p class="eyebrow" data-i18n="wholeWeek">For the whole week</p>
              <h2 data-i18n="shoppingList">Shopping List</h2>
            </div>
            <button class="ghost-button" type="button" id="copy-shopping" data-i18n="copyList">Copy list</button>
          </div>
          <div class="shopping-grid" id="shopping-list"></div>
        </section>

        <section class="view" id="progress-view" aria-label="Progress tracker">
          <div class="section-heading">
            <div>
              <p class="eyebrow" data-i18n="yourNotes">Your notes</p>
              <h2 data-i18n="cookingProgress">Cooking Progress</h2>
            </div>
            <button class="ghost-button" type="button" id="reset-progress" data-i18n="reset">Reset</button>
          </div>
          <div class="progress-grid" id="progress-list"></div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
